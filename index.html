<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="author" content="jayvengozon">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0D1B2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#E0E1DD;--surf:#f3f3f1;--ink:#0D1B2A;--mute:#415A77;--line:#c4cad1;--acc:#415A77;--accT:#E0E1DD;--emo:#1B263B;--emoT:#E0E1DD;--act:#778DA9;--actT:#0D1B2A;--danger:#b3372f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1B2A;--surf:#1B263B;--ink:#E0E1DD;--mute:#8a9db5;--line:#33445c;--acc:#778DA9;--accT:#0D1B2A;--emo:#415A77;--emoT:#E0E1DD;--act:#778DA9;--actT:#0D1B2A;--danger:#ef8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1B2A;--surf:#1B263B;--ink:#E0E1DD;--mute:#8a9db5;--line:#33445c;--acc:#778DA9;--accT:#0D1B2A;--emo:#415A77;--emoT:#E0E1DD;--act:#778DA9;--actT:#0D1B2A;--danger:#ef8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
.serif{font-family:ui-serif,"New York",Georgia,serif}
#app{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1{font:600 28px/1.1 ui-serif,"New York",Georgia,serif;margin:4px 0 14px;letter-spacing:-.01em}
h2{font:600 18px/1.2 ui-serif,"New York",Georgia,serif;margin:22px 0 8px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.nav button{width:44px;height:44px;border-radius:50%;font-size:26px;color:var(--acc);background:var(--surf);border:1px solid var(--line)}
.dt{font:600 19px ui-serif,"New York",Georgia,serif;text-align:center}
.lnk{color:var(--acc);font-weight:600;padding:8px 0}
.muted{color:var(--mute);font-size:14px}
.empty{padding:22px 4px;color:var(--mute)}
.card{display:grid;grid-template-columns:54px 1fr;gap:10px;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--emo);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.card.activity{border-left-color:var(--act)}
.card .tm{font-weight:600;font-variant-numeric:tabular-nums}
.card .ti{font:600 17px/1.25 ui-serif,"New York",Georgia,serif}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--emo);color:var(--emoT)}
.activity .tag{background:var(--act);color:var(--actT)}
.card p{margin:4px 0 0;font-size:15px}
.card b{font-weight:600;color:var(--mute)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.fab button{background:var(--acc);color:var(--accT);font-weight:600;border-radius:999px;padding:13px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab button.alt{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.tabs button{flex:1;padding:10px 0;font-size:14px;font-weight:600;color:var(--mute);border-radius:10px}
.tabs button.on{color:var(--acc);background:var(--bg)}
.row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 10px;margin-bottom:8px;min-height:50px}
.chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--mute);display:grid;place-items:center;font-size:17px;color:transparent}
.done .chk{background:var(--acc);border-color:var(--acc);color:var(--accT)}
.row .tx{flex:1;text-align:left;padding:10px 0;overflow-wrap:anywhere}
.done .tx{color:var(--mute);text-decoration:line-through}
.x{width:44px;height:44px;color:var(--mute);font-size:20px}
.x.arm{color:var(--danger);font-size:13px;font-weight:600;width:auto;padding:0 8px}
.add{display:flex;gap:8px;margin:6px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=range]{padding:0;accent-color:var(--acc);border:0;background:none}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:var(--accT);font-weight:600;border-radius:10px;padding:0 16px;min-height:44px;flex:none}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:2px 0 10px}
.bar i{display:block;height:100%;background:var(--acc)}
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 0;border-radius:8px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--surf);color:var(--ink)}
label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:12px 0 5px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.day{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 12px;font-size:14px;min-height:34px}
.chip.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.card .chips .chip{font-size:12px;padding:1px 9px;min-height:0;background:var(--bg);color:var(--mute)}
.mood{display:flex;gap:6px;margin:4px 0 8px}
.mood button{flex:1;font-size:26px;padding:8px 0;border-radius:12px;background:var(--surf);border:1px solid var(--line)}
.mood button.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.mini{display:flex;gap:6px;margin:6px 0 2px}.mini input{padding:8px 10px}.mini .btn{min-height:40px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;text-align:center}
#lock .dots{display:flex;gap:14px;margin:16px 0 8px}#lock .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}#lock .dots i.on{background:var(--acc)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin:12px 0}#lock .pad button{height:72px;border-radius:50%;background:var(--surf);color:var(--ink);font-size:26px;border:1px solid var(--line)}
#lock .lnk{display:block;margin:4px auto;color:var(--acc)}
.foot{text-align:center;color:var(--mute);font-size:12px;margin:24px 0 8px}
#guide{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--ink);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px))}
#guide .in{max-width:520px;margin:0 auto}#guide ol{padding-left:20px}#guide li{margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetHost"></div>
<div id="toast" role="status"></div>
<script>
(function(){
var K="daybook1",S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
var fresh=!S||!Array.isArray(S.e);
if(fresh)S={e:[],d:[],m:[],md:{}};norm();
function idb(fn){try{var r=indexedDB.open("daybook",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){try{fn(r.result)}catch(e){}};}catch(e){}}
function idbPut(v){idb(function(db){db.transaction("kv","readwrite").objectStore("kv").put(v,K)})}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}
if(fresh){idb(function(db){var g=db.transaction("kv").objectStore("kv").get(K);g.onsuccess=function(){try{var v=JSON.parse(g.result);if(v&&Array.isArray(v.e)){S=v;norm();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render()}}catch(e){}}})}
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
function save(){var j=JSON.stringify(S);try{localStorage.setItem(K,j)}catch(e){toast("Couldn’t save on this device")}idbPut(j)}
function norm(){if(!Array.isArray(S.dates))S.dates=[];if(!Array.isArray(S.tags))S.tags=["work","sleep","family","alone","health","money"];if(!Array.isArray(S.cope))S.cope=["Deep breathing","Went for a walk","Talked to someone","Listened to music","Rested","Wrote it down"];if(!S.mood||typeof S.mood!=="object")S.mood={};if(!S.safe||typeof S.safe!=="object")S.safe={signs:"",steps:"",people:"",reasons:""};if(!Array.isArray(S.safe.contacts))S.safe.contacts=[];if(!Array.isArray(S.safe.tools))S.safe.tools=defaultTools();if(!S.sl||typeof S.sl!=="object")S.sl={};if(typeof S.q!=="string")S.q=""}
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var pad=function(n){return(n<10?"0":"")+n};
var iso=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var nowT=function(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
var fmt=function(d,o){return new Date(d+"T12:00").toLocaleDateString(undefined,o)};
var shift=function(d,n){var x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return iso(x)};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var today=iso(new Date()),cur=today,tab="home",armed=null,sheet=null;
function toast(m){var t=$("#toast");t.textContent=m;t.className="on";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},2200)}

var FACES=["😞","😕","😐","🙂","😄"],FN=["Very low","Low","Okay","Good","Great"];
function moodBar(d,label){var m=S.mood[d]||0;return '<h2>'+label+'</h2><div class="mood">'+FACES.map(function(f,i){return '<button data-a="mood" data-d="'+d+'" data-id="'+(i+1)+'" class="'+(m===i+1?'on':'')+'" aria-label="'+FN[i]+'">'+f+'</button>'}).join("")+'</div>'}
function tg(x){return x.tags&&x.tags.length?'<div class="chips">'+x.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join("")+'</div>':''}
function lst(k,a){return a.length?a.map(function(t,i){var arm=armed==="del"+k+i;return '<div class="row"><div class="tx">'+esc(t)+'</div><button class="x'+(arm?' arm':'')+'" data-a="del'+k+'" data-id="'+i+'" aria-label="Remove">'+(arm?'Remove?':'✕')+'</button></div>'}).join(""):'<p class="muted">None yet. Add them while writing an entry.</p>'}
function chipsT(){var sel=sheet.x.tags||[];return '<label>Triggers and tags</label><div class="chips">'+S.tags.map(function(t,i){return '<button type="button" class="chip'+(sel.indexOf(t)>=0?' on':'')+'" data-a="tagT" data-id="'+i+'">'+esc(t)+'</button>'}).join("")+'</div><div class="mini"><input id="nt" placeholder="New tag" aria-label="New tag" autocomplete="off"><button type="button" class="btn ghost" data-a="newT">Add</button></div>'}
function chipsC(){var us=S.cope.map(function(c,i){return{i:i,n:S.e.filter(function(e){return e.type==="emotion"&&e.handled&&e.handled.toLowerCase().indexOf(c.toLowerCase())>=0}).length}}).sort(function(a,b){return b.n-a.n||a.i-b.i});return '<label>Your coping toolbox (tap to add; number = times used)</label><div class="chips">'+us.map(function(u){return '<button type="button" class="chip" data-a="cope" data-id="'+u.i+'">'+esc(S.cope[u.i])+(u.n?' <span class="muted">'+u.n+'</span>':'')+'</button>'}).join("")+'</div><div class="mini"><input id="nc" placeholder="New coping option" aria-label="New coping option" autocomplete="off"><button type="button" class="btn ghost" data-a="newC">Add</button></div>'}
function grab(){var f=$("#ef");if(!f)return;["emotion","intensity","details","time","handled","what","people","felt","pl","ma","notes"].forEach(function(n){if(f.elements[n])sheet.x[n]=f.elements[n].value})}
function addTag(){grab();var i=$("#nt"),v=i?i.value.trim():"";if(!v)return;var ix=S.tags.map(function(t){return t.toLowerCase()}).indexOf(v.toLowerCase());if(ix<0){S.tags.push(v);ix=S.tags.length-1;save()}var n=S.tags[ix];if(sheet.x.tags.indexOf(n)<0)sheet.x.tags.push(n);drawSheet()}
function addCope(){grab();var i=$("#nc"),v=i?i.value.trim():"";if(!v)return;if(S.cope.map(function(t){return t.toLowerCase()}).indexOf(v.toLowerCase())<0){S.cope.push(v);save()}var c=(sheet.x.handled||"").trim();sheet.x.handled=c?c.replace(/[,.]$/,"")+", "+v:v;drawSheet()}
function mandFor(d){return S.m.filter(function(m){return m.from<=d})}
function stats(d){
  var ms=mandFor(d),dn=(S.md[d]||{}),dl=S.d.filter(function(x){return x.date===d});
  var tot=ms.length+dl.length,ok=ms.filter(function(m){return dn[m.id]}).length+dl.filter(function(x){return x.done}).length;
  return{tot:tot,ok:ok}
}
function head(title){
  var h='<h1>'+title+'</h1><div class="nav"><button data-a="prev" aria-label="Previous day">‹</button><div class="dt">'+fmt(cur,{weekday:"long",month:"short",day:"numeric"})+'</div><button data-a="next" aria-label="Next day">›</button></div>';
  if(cur!==today)h+='<button class="lnk" data-a="now">Back to today</button>';
  return h
}
function sleepBlock(d){
  var s=S.sl[d]||{};
  return '<h2>Sleep and energy</h2><div class="add" style="align-items:center"><label for="sh" style="margin:0;flex:none">Hours slept</label><input id="sh" type="number" inputmode="decimal" min="0" max="24" step="0.5" value="'+esc(s.h||"")+'" data-d="'+d+'"></div><div class="chips">'+[1,2,3,4,5].map(function(n){return '<button class="chip'+(s.en===n?' on':'')+'" data-a="en" data-d="'+d+'" data-id="'+n+'" aria-label="Energy '+n+'">'+n+'</button>'}).join("")+'</div><p class="muted">Energy: 1 drained, 5 energized</p>'
}
function viewToday(){
  var es=S.e.filter(function(x){return x.date===cur}).sort(function(a,b){return a.time<b.time?-1:1});
  var h=head("Journal")+moodBar(cur,"Mood for this day")+sleepBlock(cur);
  if(!es.length)h+='<p class="empty">No entries for this day yet. Add one when you notice an emotion or finish something you want to remember.</p>';
  es.forEach(function(x){
    var b;
    if(x.type==="emotion")b='<div class="ti"><span class="tag">Emotion</span>'+esc(x.emotion)+(x.intensity?' <span class="muted">'+esc(x.intensity)+'/10</span>':'')+'</div>'+(x.details?'<p>'+esc(x.details)+'</p>':'')+(x.handled?'<p><b>What I did:</b> '+esc(x.handled)+'</p>':'')+(x.notes?'<p><b>Notes:</b> '+esc(x.notes)+'</p>':'');
    else b='<div class="ti"><span class="tag">Activity</span>'+esc(x.what)+'</div>'+(x.people?'<p><b>With:</b> '+esc(x.people)+'</p>':'')+(x.felt?'<p><b>I felt:</b> '+esc(x.felt)+'</p>':'')+(x.pl||x.ma?'<p><b>Enjoyed / achieved:</b> '+esc(x.pl||"–")+' / '+esc(x.ma||"–")+' out of 10</p>':'')+(x.notes?'<p><b>Notes:</b> '+esc(x.notes)+'</p>':'');
    h+='<button class="card '+x.type+'" data-a="edit" data-id="'+x.id+'"><div class="tm">'+esc(x.time)+'</div><div>'+b+tg(x)+'</div></button>'
  });
  h+='<div class="fab"><button class="alt" data-a="add" data-t="activity">+ Activity</button><button data-a="add" data-t="emotion">+ Emotion</button></div>';
  return h
}
function row(done,text,a,id){
  var arm=armed===a+id;
  return '<div class="row'+(done?' done':'')+'"><button class="chk" data-a="tog'+a+'" data-id="'+id+'" aria-label="Toggle">✓</button><div class="tx">'+esc(text)+'</div><button class="x'+(arm?' arm':'')+'" data-a="del'+a+'" data-id="'+id+'" aria-label="Remove">'+(arm?'Remove?':'✕')+'</button></div>'
}
function bar(s){return '<div class="bar"><i style="width:'+(s.tot?Math.round(100*s.ok/s.tot):0)+'%"></i></div>'}
function viewList(){
  var ms=mandFor(cur),dn=S.md[cur]||{},dl=S.d.filter(function(x){return x.date===cur});
  var h=head("Checklist");
  h+=bar(stats(cur))+'<p class="muted" style="margin:-4px 0 0">'+stats(cur).ok+' of '+stats(cur).tot+' done</p>';
  h+='<h2>Every day</h2><p class="muted" style="margin:-4px 0 8px">Added here once, shown on every day from the day you add it.</p>';
  ms.forEach(function(m){h+=row(dn[m.id],m.text,"M",m.id)});
  h+='<form class="add" data-f="m"><input name="t" placeholder="Add a daily item" autocomplete="off" aria-label="New daily item"><button class="btn">Add</button></form>';
  h+='<h2>Just this day</h2>';
  dl.forEach(function(x){h+=row(x.done,x.text,"D",x.id)});
  h+='<form class="add" data-f="d"><input name="t" placeholder="Add an item for this day" autocomplete="off" aria-label="New item for this day"><button class="btn">Add</button></form>';
  return h
}
function viewHome(){
  var set={};S.e.forEach(function(x){set[x.date]=1});S.dates.forEach(function(d){set[d]=1});set[today]=1;
  var ds=Object.keys(set).sort().reverse(),h='<h1>Daybook</h1><div class="add"><button class="btn" data-a="pick" style="width:100%">Add date</button></div>'+moodBar(today,"How are you today?")+'<button class="day" data-a="safe" style="border-left:5px solid var(--danger)"><b class="serif">My safety plan</b><span class="muted">'+(S.safe.signs||S.safe.steps||S.safe.people||S.safe.reasons?'Open':'Set up')+'</span></button>'+'<h2>Your days</h2>';
  ds.forEach(function(d){
    var es=S.e.filter(function(x){return x.date===d}),n=es.length,s=stats(d);
    var pv=es.slice(0,2).map(function(x){return esc(x.type==="emotion"?x.emotion:x.what)}).join(", ");
    h+='<button class="day" data-a="go" data-id="'+d+'"><span><b class="serif">'+fmt(d,{weekday:"short",month:"short",day:"numeric",year:"numeric"})+'</b>'+(S.mood[d]?' '+FACES[S.mood[d]-1]:'')+(d===today?' <span class="tag" style="background:var(--acc);color:var(--accT);margin-left:6px">Today</span>':'')+'<br><span class="muted">'+(pv||"No entries yet")+(n>2?" and "+(n-2)+" more":"")+'</span></span><span class="muted" style="flex:none;margin-left:12px;text-align:right">'+n+(n===1?" entry":" entries")+(s.tot?'<br>'+s.ok+'/'+s.tot+' checked':'')+'</span></button>'
  });
  return h
}
function av(a){return a.length?(a.reduce(function(x,y){return x+y},0)/a.length).toFixed(1):"–"}
function topN(m){var k=Object.keys(m).sort(function(a,b){return m[b]-m[a]}).slice(0,3);return k.length?k.map(function(x){return x+" ("+m[x]+")"}).join(", "):"–"}
function weekSummary(){
  var days=[];for(var i=6;i>=0;i--)days.push(shift(today,-i));
  var mo=[],sl=[],en=[];
  days.forEach(function(d){if(S.mood[d])mo.push(S.mood[d]);var s=S.sl[d];if(s){var h=parseFloat(s.h);if(!isNaN(h))sl.push(h);if(s.en)en.push(s.en)}});

var P=null,PK="daybook1pin",TK="daybook1try",ent="",mode="",tmp="",lockMsg="",forgot=false,hideAt=0;
